<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BEYBARS AI SIGNAL</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphism styles */
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-card-glow {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.35);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.15);
    }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.1); }
    }

    .glow-bg-1 {
      animation: pulseGlow 8s ease-in-out infinite;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Dynamic Glowing Background -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="glow-bg-1 absolute -top-32 -left-32 w-96 h-96 bg-blue-600/30 rounded-full blur-[120px]"></div>
    <div class="glow-bg-1 absolute top-1/2 -right-32 w-96 h-96 bg-cyan-500/20 rounded-full blur-[140px]" style="animation-delay: 2s;"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-20"></div>
  </div>

  <!-- Header -->
  <header class="flex items-center justify-between w-full mb-4 p-4 glass-card rounded-2xl shadow-xl">
    <div class="flex items-center gap-3">
      <div class="p-2.5 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400">
        <i data-lucide="cpu" class="w-6 h-6 animate-pulse"></i>
      </div>
      <div>
        <h1 class="text-base font-bold bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-400 bg-clip-text text-transparent tracking-wide">
          BEYBARS AI SIGNAL
        </h1>
        <p class="text-[11px] text-slate-400">v3.0 Pro Engine</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span class="text-[11px] font-semibold text-emerald-400 flex items-center gap-1">
        ONLINE
      </span>
    </div>
  </header>

  <!-- Control Form -->
  <main class="space-y-4">
    <div class="glass-card p-5 rounded-3xl space-y-4">
      
      <!-- Currency Pair Selector (Dropdown + Search) -->
      <div class="space-y-2 relative">
        <div class="flex justify-between items-center">
          <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Валютная пара (31 OTC)</label>
          <span id="selectedPairBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">EUR/USD OTC</span>
        </div>

        <!-- Custom Select Box Trigger -->
        <button id="dropdownToggle" onclick="toggleDropdown()" class="w-full p-3.5 rounded-2xl text-xs font-semibold text-left border bg-slate-900/60 border-slate-700/80 text-slate-200 flex items-center justify-between hover:border-blue-500/50 transition-all">
          <span id="dropdownSelectedText" class="flex items-center gap-2">
            <i data-lucide="coins" class="w-4 h-4 text-blue-400"></i>
            EUR/USD OTC
          </span>
          <i data-lucide="chevron-down" id="dropdownChevron" class="w-4 h-4 text-slate-400 transition-transform"></i>
        </button>

        <!-- Custom Dropdown Menu -->
        <div id="dropdownMenu" class="hidden absolute left-0 right-0 top-full mt-2 z-50 glass-card-glow rounded-2xl p-3 space-y-2 shadow-2xl border border-blue-500/30">
          <!-- Search Box -->
          <div class="relative">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="pairSearchInput" oninput="filterPairs()" placeholder="Поиск пары (например, RUB, USD...)" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-8 pr-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-500">
          </div>

          <!-- List of pairs -->
          <div id="pairsContainer" class="max-h-48 overflow-y-auto space-y-1 custom-scrollbar pr-1">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>

      <!-- Timeframe Selector -->
      <div class="space-y-2">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Время экспирации</label>
        <div class="grid grid-cols-3 gap-2" id="timeGrid">
          <button onclick="selectTime(this, '15 Seconds')" class="time-btn p-3 rounded-2xl text-xs font-medium text-center border bg-blue-600/20 border-blue-500 text-blue-300 shadow-[0_0_15px_rgba(59,130,246,0.2)]">15 Sec</button>
          <button onclick="selectTime(this, '30 Seconds')" class="time-btn p-3 rounded-2xl text-xs font-medium text-center border bg-slate-900/40 border-slate-800 text-slate-400">30 Sec</button>
          <button onclick="selectTime(this, '1 Minute')" class="time-btn p-3 rounded-2xl text-xs font-medium text-center border bg-slate-900/40 border-slate-800 text-slate-400">1 Min</button>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generateBtn" onclick="generateSignal()" class="w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95 bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-[0_0_25px_rgba(59,130,246,0.4)] flex items-center justify-center gap-2">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        GENERATE SIGNAL
      </button>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="hidden glass-card-glow p-6 rounded-3xl text-center space-y-5 my-4">
      <div class="relative flex items-center justify-center w-16 h-16 mx-auto">
        <div class="absolute inset-0 rounded-full border-2 border-dashed border-blue-500/40 animate-spin"></div>
        <i data-lucide="loader-2" class="w-8 h-8 text-blue-400 animate-spin"></i>
      </div>
      <div class="space-y-2">
        <p id="loadingText" class="text-xs font-semibold text-blue-300 tracking-wide">Analyzing Market Data...</p>
        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden p-0.5 border border-white/5">
          <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-cyan-400 h-full rounded-full shadow-[0_0_12px_rgba(59,130,246,0.8)] transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Signal Result Card -->
    <div id="signalResult" class="hidden glass-card-glow p-6 rounded-3xl space-y-5 my-4 border-blue-500/40 relative overflow-hidden transition-all duration-500 transform scale-95 opacity-0">
      <div class="flex justify-between items-center text-xs text-slate-400">
        <span id="resultPair" class="font-bold text-slate-200">EUR/USD OTC</span>
        <span id="resultTime" class="px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700">15 Seconds</span>
      </div>

      <div class="text-center py-1">
        <div id="directionBadge" class="inline-flex items-center gap-3 px-8 py-3.5 rounded-2xl border bg-emerald-500/15 border-emerald-500/40 text-emerald-400 shadow-[0_0_25px_rgba(34,197,94,0.25)]">
          <i id="directionIcon" data-lucide="trending-up" class="w-8 h-8"></i>
          <span id="directionText" class="text-3xl font-black tracking-wider">UP</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="p-3 rounded-2xl bg-slate-900/60 border border-slate-800">
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400 mb-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-blue-400"></i> Confidence
          </div>
          <p id="confidenceText" class="text-lg font-bold text-slate-100">87%</p>
        </div>
        <div class="p-3 rounded-2xl bg-slate-900/60 border border-slate-800">
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400 mb-1">
            <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i> AI Trigger
          </div>
          <p id="reasonText" class="text-xs font-semibold text-slate-200 truncate">Momentum detected</p>
        </div>
      </div>
    </div>

    <!-- History Block -->
    <div class="glass-card p-5 rounded-3xl space-y-3">
      <div class="flex items-center gap-2 text-slate-300 border-b border-slate-800/80 pb-2.5">
        <i data-lucide="history" class="w-4 h-4 text-blue-400"></i>
        <h3 class="text-xs font-bold uppercase tracking-wider">История сигналов</h3>
      </div>
      <div id="historyList" class="space-y-2 max-h-52 overflow-y-auto pr-1 custom-scrollbar">
        <p id="emptyHistory" class="text-xs text-center text-slate-500 py-4">История пуста</p>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-[10px] text-slate-500">
    BEYBARS AI SIGNAL • Demo AI Interface • Not Financial Advice
  </footer>

  <!-- Script Logic -->
  <script>
    // 31 Currency Pairs List
    const ALL_PAIRS = [
      "AED/CNY OTC", "AUD/CAD OTC", "AUD/USD OTC", "CAD/JPY OTC", "CHF/JPY OTC",
      "CHF/NOK OTC", "EUR/JPY OTC", "EUR/USD OTC", "GBP/AUD OTC", "GBP/USD OTC",
      "GBP/JPY OTC", "MAD/USD OTC", "NGN/USD OTC", "NZD/USD OTC", "UAH/USD OTC",
      "USD/ARS OTC", "USD/BRL OTC", "USD/CHF OTC", "USD/CNH OTC", "USD/DZD OTC",
      "USD/IDR OTC", "USD/INR OTC", "USD/MXN OTC", "USD/NGN OTC", "USD/PKR OTC",
      "USD/RUB OTC", "USD/SGD OTC", "USD/TRY OTC", "USD/ZAR OTC", "ZAR/USD OTC",
      "USD/CLP OTC"
    ];

    let selectedPair = 'EUR/USD OTC';
    let selectedTime = '15 Seconds';
    let history = [];

    const loadingSteps = [
      'Analyzing Market Data...',
      'Loading AI Models...',
      'Scanning Liquidity Zones...',
      'Calculating Probability...'
    ];

    const aiReasons = [
      'Momentum detected', 'Trend continuation', 'AI probability increase',
      'EMA confirmation', 'RSI confirmation', 'Market structure detected',
      'Liquidity zone', 'Smart Money Concept', 'Volume confirmation'
    ];

    // Initialize UI
    document.addEventListener('DOMContentLoaded', () => {
      renderPairList(ALL_PAIRS);
      lucide.createIcons();
    });

    function renderPairList(pairs) {
      const container = document.getElementById('pairsContainer');
      container.innerHTML = '';

      if (pairs.length === 0) {
        container.innerHTML = `<p class="text-[11px] text-slate-500 text-center py-2">Пара не найдена</p>`;
        return;
      }

      pairs.forEach(pair => {
        const isSelected = pair === selectedPair;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => selectPair(pair);
        btn.className = `w-full text-left px-3 py-2 rounded-xl text-xs font-medium transition-all flex items-center justify-between ${
          isSelected 
            ? 'bg-blue-600/30 text-blue-300 font-bold border border-blue-500/40' 
            : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'
        }`;
        btn.innerHTML = `
          <span>${pair}</span>
          ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-blue-400"></i>' : ''}
        `;
        container.appendChild(btn);
      });
      lucide.createIcons();
    }

    function toggleDropdown() {
      const menu = document.getElementById('dropdownMenu');
      const chevron = document.getElementById('dropdownChevron');
      const isHidden = menu.classList.contains('hidden');

      if (isHidden) {
        menu.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        document.getElementById('pairSearchInput').focus();
      } else {
        menu.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    }

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('dropdownMenu');
      const toggleBtn = document.getElementById('dropdownToggle');
      if (!dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
        dropdown.classList.add('hidden');
        document.getElementById('dropdownChevron').classList.remove('rotate-180');
      }
    });

    function filterPairs() {
      const query = document.getElementById('pairSearchInput').value.toLowerCase().trim();
      const filtered = ALL_PAIRS.filter(p => p.toLowerCase().includes(query));
      renderPairList(filtered);
    }

    function selectPair(pair) {
      selectedPair = pair;
      document.getElementById('dropdownSelectedText').innerHTML = `
        <i data-lucide="coins" class="w-4 h-4 text-blue-400"></i>
        ${pair}
      `;
      document.getElementById('selectedPairBadge').innerText = pair;
      toggleDropdown();
      renderPairList(ALL_PAIRS);
      document.getElementById('pairSearchInput').value = '';
    }

    function selectTime(btn, time) {
      document.querySelectorAll('.time-btn').forEach(b => {
        b.className = 'time-btn p-3 rounded-2xl text-xs font-medium text-center border bg-slate-900/40 border-slate-800 text-slate-400';
      });
      btn.className = 'time-btn p-3 rounded-2xl text-xs font-medium text-center border bg-blue-600/20 border-blue-500 text-blue-300 shadow-[0_0_15px_rgba(59,130,246,0.2)]';
      selectedTime = time;
    }

    function generateSignal() {
      const btn = document.getElementById('generateBtn');
      const loadingState = document.getElementById('loadingState');
      const signalResult = document.getElementById('signalResult');
      const loadingText = document.getElementById('loadingText');
      const progressBar = document.getElementById('progressBar');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      signalResult.classList.add('hidden', 'opacity-0', 'scale-95');
      loadingState.classList.remove('hidden');

      let step = 0;
      progressBar.style.width = '0%';
      loadingText.innerText = loadingSteps[0];

      const interval = setInterval(() => {
        step++;
        if (step < loadingSteps.length) {
          loadingText.innerText = loadingSteps[step];
          progressBar.style.width = `${(step / loadingSteps.length) * 100}%`;
        }
      }, 750);

      setTimeout(() => {
        clearInterval(interval);
        progressBar.style.width = '100%';

        setTimeout(() => {
          loadingState.classList.add('hidden');
          renderResult();
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }, 300);
      }, 3000);
    }

    function renderResult() {
      const signalResult = document.getElementById('signalResult');
      const isUp = Math.random() > 0.5;
      const confidence = Math.floor(Math.random() * (98 - 65 + 1)) + 65;
      const reason = aiReasons[Math.floor(Math.random() * aiReasons.length)];
      const direction = isUp ? 'UP' : 'DOWN';
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      document.getElementById('resultPair').innerText = selectedPair;
      document.getElementById('resultTime').innerText = selectedTime;
      document.getElementById('confidenceText').innerText = `${confidence}%`;
      document.getElementById('reasonText').innerText = reason;

      const badge = document.getElementById('directionBadge');
      const text = document.getElementById('directionText');
      const icon = document.getElementById('directionIcon');

      text.innerText = direction;

      if (isUp) {
        badge.className = 'inline-flex items-center gap-3 px-8 py-3.5 rounded-2xl border bg-emerald-500/15 border-emerald-500/40 text-emerald-400 shadow-[0_0_25px_rgba(34,197,94,0.25)]';
        icon.setAttribute('data-lucide', 'trending-up');
      } else {
        badge.className = 'inline-flex items-center gap-3 px-8 py-3.5 rounded-2xl border bg-rose-500/15 border-rose-500/40 text-rose-400 shadow-[0_0_25px_rgba(239,68,68,0.25)]';
        icon.setAttribute('data-lucide', 'trending-down');
      }

      lucide.createIcons();

      signalResult.classList.remove('hidden');
      setTimeout(() => {
        signalResult.classList.remove('opacity-0', 'scale-95');
      }, 50);

      // Add to History
      history.unshift({ pair: selectedPair, time: selectedTime, direction, confidence, timestamp: timeStr });
      if (history.length > 20) history.pop();
      updateHistoryUI();
    }

    function updateHistoryUI() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      history.forEach(item => {
        const isUp = item.direction === 'UP';
        const el = document.createElement('div');
        el.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800/80 text-xs';
        el.innerHTML = `
          <div>
            <p class="font-bold text-slate-200">${item.pair}</p>
            <p class="text-[10px] text-slate-500">${item.timestamp} • ${item.time}</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-slate-400 font-medium">${item.confidence}%</span>
            <span class="font-bold px-2 py-1 rounded-lg border flex items-center gap-1 ${
              isUp ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-rose-500/10 border-rose-500/30 text-rose-400'
            }">
              <i data-lucide="${isUp ? 'arrow-up-right' : 'arrow-down-right'}" class="w-3.5 h-3.5"></i>
              ${item.direction}
            </span>
          </div>
        `;
        list.appendChild(el);
      });
      lucide.createIcons();
    }
  </script>
</body>
</html>
